<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AcousticBench Studio</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="shell">
<aside class="rail">
  <div class="brand">
    <p class="team">Malik Williams &middot; Isaiah Tijero &mdash; Senior Project</p>
    <h1>AcousticBench <span>Studio</span></h1>
    <p class="sub">Test room-sound models on synthetic + measured clips.</p>
  </div>
  <nav aria-label="Sections">
    <button data-view="overview" class="rail-btn">Overview</button>
    <button data-view="datasets" class="rail-btn">Datasets</button>
    <button data-view="evaluate" class="rail-btn">Evaluate</button>
    <button data-view="runs" class="rail-btn">Runs</button>

    <button data-view="leaderboard" class="rail-btn">Leaderboard</button>

  <div class="rail-foot">
    <p>Malik Williams &middot; Isaiah Tijero</p>
    <p>Advisor: Dr. Sambit Bhattacharya</p>
  </div>
</aside>
<div class="stage">
  <p class="flash" id="flash" role="status"></p>
  <main id="main"><p class="muted">Warming up&hellip;</p></main>
  <footer><p>AcousticBench Studio &middot; local harness &middot; CSC 490-D1</p></footer>
</div>
</div>
<script src="/static/app.js"></script>

</html>
