[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echobench"
version = "0.2.0"
description = "EchoBench — reproducible sim-to-real benchmark for room-acoustic models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Malik Williams"},
  {name = "Isaiah Tijero"},
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
echobench = "echobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"echobench.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
